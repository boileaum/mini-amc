name: ci
on: [push, pull_request]
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - run: uv run pre-commit run trailing-whitespace --all-files
      - run: uv run pre-commit run end-of-file-fixer --all-files
      - run: uv run pre-commit run check-yaml --all-files
      - run: uv run pre-commit run check-toml --all-files
      - run: uv run pre-commit run check-merge-conflict --all-files
      - run: uv run pre-commit run detect-private-key --all-files
      - run: uv run pre-commit run check-added-large-files --all-files
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - run: uv run pre-commit run ruff --all-files
      - run: uv run pre-commit run ruff-format --all-files
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - run: uv run pre-commit run ty --all-files
  docstrings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - run: uv run pre-commit run pydoclint --all-files
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - run: uv run pre-commit run sphinx-build --all-files
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - run: uv run pre-commit run pytest --all-files --hook-stage pre-push
