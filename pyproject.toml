[build-system]
requires = ["setuptools>=61.2"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-amc"
authors = [
    { name = "Matthieu Boileau", email = "matthieu.boileau@math.unistra.fr" },
]
description = "Mini-clone of Auto-Multiple-Choice based on Typst: QCM copy generation, OMR reading, review web UI"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    "opencv-python-headless==5.0.0.93",
    "numpy==2.5.4",
    "pillow==13.0.0",
    "qrcode==8.2",
    "PyYAML==6.0.3",
    "fastapi==0.162.5",
    "uvicorn==0.54.0",
]
dynamic = ["version"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Repository = "https://github.com/boileaum/mini-amc.git"

[project.scripts]
mini-amc = "mini_amc.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
mini_amc = ["examples/*", "template/*"]

[tool.setuptools.dynamic.version]
attr = "mini_amc.__version__"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "doc" },
]
test = ["pytest", "pytest-cov", "genbadge", "defusedxml", "httpx2"]
lint = ["ruff", "ty", "pre-commit", "pydoclint"]
doc = [
    "Sphinx>=7.2.2",
    "myst-parser",
    "furo",
    "sphinx-copybutton",
    "sphinxcontrib-programoutput",
    "sphinxcontrib-mermaid",
    "sphinx-autobuild",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
extend-select = ["D213"]
ignore = ["D107", "D212"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
# example code printed on the exam copy: a docstring would show up in the statement
"src/mini_amc/examples/code/**" = ["D"]

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.analysis]
allowed-unresolved-imports = ["cv2", "cv2.*"]

[tool.coverage.run]
parallel = true
source = ["src/"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
