repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^assets/coverage\.svg$
      - id: end-of-file-fixer
        exclude: ^assets/coverage\.svg$
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: local
    hooks:
      - id: ruff
        name: ruff check (lint + autofix)
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ty
        name: ty check (type check)
        entry: uv run ty check
        language: system
        types: [python]
      - id: pydoclint
        name: pydoclint (docstrings)
        entry: uv run pydoclint src tests
        language: system
        pass_filenames: false
      - id: sphinx-build
        name: sphinx-build (docs, warnings as errors)
        entry: uv run sphinx-build -W -b html docs/source docs/build
        language: system
        pass_filenames: false
        files: ^(docs/|src/)
      - id: pytest
        name: pytest (unit tests)
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
      - id: coverage
        name: coverage (pytest --cov + fail-under)
        entry: uv run pytest -q --cov --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=90
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: coverage-badge
        name: coverage-badge (regenerate assets/coverage.svg)
        entry: uv run genbadge coverage -i coverage.xml -o assets/coverage.svg
        language: system
        pass_filenames: false
        stages: [pre-push]
